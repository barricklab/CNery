name: CNery
channels:
  - bioconda
  - conda-forge
  - defaults
# breseq is NOT a dependency: CNery reads pre-generated coverage tables and never invokes it.
# Generating those tables needs pre-release breseq from the Barrick lab channel -- not the
# bioconda build that used to be pinned here. See "Generating a coverage table" in README.md.
dependencies:
  - pandas>=2.2.0
  - numpy>=1.26.0
  - matplotlib>=3.8.0
  - statsmodels>=0.14.0
  - scipy>=1.12.0
  - seaborn>=0.13.0
  - pathlib>=1.0.0
  - setuptools>=68.2.0