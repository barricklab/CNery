[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tools.setuptools]
packages=["src"]
include-package-data = true

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]
# A bare `pytest` runs BOTH tiers, so authentic coverage cannot silently lapse. On a cold cache
# that downloads ~105 MB. Use `-m synthetic` for the fast offline inner loop.
addopts    = "-q --tb=short"
markers = [
    "synthetic: fast, offline, self-contained data; applied automatically to anything not authentic",
    "authentic: runs against real coverage tables fetched from GitHub Releases (see DEVELOPER)",
    ]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning:statsmodels",
    "ignore::SyntaxWarning",
    ]


[project]
name = "CNery"
version = "1.1.0"
authors = [
	{name = "Pranesh Rao", email = "pranesh.rao@utexas.edu"},
	{name = "Jefferey Barrick", email = "jbarrick@utexas.edu"}
]
description = "An extension of breseq to determine copy number variations from coverage data"
readme="README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dynamic = ["dependencies"]


[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.scripts]
CNery = "CNery.get_CNV:main"

[project.urls]
Homepage = "https://github.com/barricklab/CNery"
Issues = "https://github.com/barricklab/CNery/issues"
